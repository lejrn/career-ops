# Integration fixture: Cohere + Mobileye (local parsers) + Cato (Greenhouse API).
# Use: CAREER_OPS_PORTALS=test/fixtures/portals-local-parsers.yml node scan.mjs --dry-run

title_filter:
  positive: []
  negative: []

tracked_companies:
  - name: Cohere
    careers_url: https://jobs.ashbyhq.com/cohere
    scan_method: local_parser
    parser:
      command: python3
      script: test/fixtures/parsers/cohere_jobs.py
      args:
        - --stdout-jobs
        - --no-output
      timeout_ms: 45000
    enabled: true

  - name: Mobileye
    careers_url: https://careers.mobileye.com/jobs
    scan_method: local_parser
    parser:
      command: python3
      script: test/fixtures/parsers/mobileye_nuxt_jobs.py
      args:
        - --url
        - "{careers_url}"
        - --stdout-jobs
        - --no-output
      timeout_ms: 45000
    enabled: true

  - name: Cato Networks
    careers_url: https://www.catonetworks.com/careers/
    api: https://boards-api.greenhouse.io/v1/boards/catonetworks/jobs
    enabled: true
